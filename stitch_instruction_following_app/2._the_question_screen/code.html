</div>
<div class="max-w-[320px] mb-unit-12">
<h1 class="font-display-hero-mobile text-display-hero-mobile text-text-primary tracking-tight font-bold leading-tight">Mau jadian?
      </h1>
<p class="font-body-sm text-body-sm text-text-muted mt-unit-4 max-w-[260px] mx-auto opacity-75">
        Ditulis dengan tulus, tanpa tergesa-gesa.
      </p>
</div>
<div class="w-full max-w-[280px] flex flex-col gap-unit-3 relative" id="cta-cluster">
<button class="w-full h-[54px] rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg tracking-wide shadow-md hover:brightness-105 active:scale-[0.98] transition-all duration-150 flex items-center justify-center cursor-pointer" id="btn-yes" type="button">
        Iya
      </button>
<div class="relative w-full h-[54px]">
<button class="w-full h-[54px] rounded-full bg-surface-container-low text-text-muted hover:text-text-primary hover:bg-surface-container active:scale-[0.98] transition-all duration-200 font-label-lg text-label-lg tracking-wide flex items-center justify-center cursor-pointer shadow-sm" id="btn-no" type="button">Yakin?</button>
</div>
</div>
<div class="mt-unit-16">
<span class="font-label-mono text-label-mono text-text-soft uppercase tracking-wider">
        Satu jawaban untuk hari ini
      </span>
</div>
</div>
</div>
<script>
  (function() {
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    
    if (btnNo && btnYes) {
      let dodgeCount = 0;
      const originalText = btnNo.textContent;

      const playfulLabels = [
        'Yakin?',
        'Coba pikir lagi',
        'Masa sih?',
        'Jahat banget...',
        'Sekali lagi deh'
      ];

      btnNo.addEventListener('mouseenter', () => {
        if (dodgeCount < playfulLabels.length) {
          btnNo.textContent = playfulLabels[dodgeCount];
          dodgeCount++;
        }
      });

      btnNo.addEventListener('click', (e) => {
        if (dodgeCount < 3) {
          e.preventDefault();
          const offsetX = (Math.random() - 0.5) * 60;
          const offsetY = (Math.random() - 0.5) * 40;
          btnNo.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
          dodgeCount++;
        }
      });
    }
  })();
</script></main></div>
